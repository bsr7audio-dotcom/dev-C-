<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Tugas Sekolah Modern</title>
    <!-- Tailwind CSS untuk styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti untuk animasi perayaan -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <!-- Font Inter dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-indigo-50 min-h-screen text-slate-800 flex flex-col justify-between">

    <!-- Container Utama -->
    <main class="max-w-4xl w-full mx-auto p-4 sm:p-6 lg:p-8">
        
        <!-- Header -->
        <header class="text-center mb-8">
            <div class="inline-block p-3 bg-indigo-100 text-indigo-600 rounded-2xl mb-3 shadow-inner">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                </svg>
            </div>
            <h1 class="text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl">Manajemen Tugas Sekolah</h1>
            <p class="mt-2 text-sm sm:text-base text-slate-600">Kelola dan selesaikan tugas-tugas sekolahmu dengan lebih mudah dan terstruktur.</p>
        </header>

        <!-- Grid Layout: Form di Kiri/Atas, Daftar Tugas di Kanan/Bawah -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Kolom Form Tambah Tugas -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-2xl shadow-xl shadow-slate-100 border border-slate-100 p-6 sticky top-6">
                    <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-indigo-600"></span>
                        Tambah Tugas Baru
                    </h2>
                    
                    <form id="formTugas" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Mata Pelajaran</label>
                            <input type="text" id="mataPelajaran" required placeholder="Contoh: Matematika" 
                                class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                        </div>
                        
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Deskripsi Tugas / PR</label>
                            <textarea id="deskripsi" rows="3" required placeholder="Contoh: Kerjakan halaman 45-46 no 1-5" 
                                class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition resize-none"></textarea>
                        </div>
                        
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Tenggat Waktu (Deadline)</label>
                            <input type="text" id="deadline" required placeholder="Contoh: Senin, 12 Oktober" 
                                class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                        </div>

                        <button type="submit" 
                            class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-indigo-200 text-sm">
                            Simpan Tugas
                        </button>
                    </form>
                </div>
            </div>

            <!-- Kolom Daftar Tugas -->
            <div class="lg:col-span-2 space-y-6">
                
                <!-- Statistik & Filter Bar -->
                <div class="bg-white rounded-2xl shadow-xl shadow-slate-100 border border-slate-100 p-4 sm:p-5 flex flex-col sm:flex-row justify-between items-center gap-4">
                    <div class="flex items-center gap-3">
                        <div class="bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-xl font-bold text-sm" id="statTotal">0 Total</div>
                        <div class="bg-emerald-50 text-emerald-600 px-3 py-1.5 rounded-xl font-bold text-sm" id="statSelesai">0 Selesai</div>
                    </div>
                    
                    <!-- Tombol Filter -->
                    <div class="flex bg-slate-100 p-1 rounded-xl w-full sm:w-auto">
                        <button onclick="ubahFilter('semua')" id="btnFilterSemua" class="flex-1 sm:flex-none px-4 py-1.5 text-xs font-semibold rounded-lg bg-white text-indigo-600 shadow-sm transition">Semua</button>
                        <button onclick="ubahFilter('belum')" id="btnFilterBelum" class="flex-1 sm:flex-none px-4 py-1.5 text-xs font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition">Belum</button>
                        <button onclick="ubahFilter('selesai')" id="btnFilterSelesai" class="flex-1 sm:flex-none px-4 py-1.5 text-xs font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition">Selesai</button>
                    </div>
                </div>

                <!-- List Kontainer Tugas -->
                <div id="daftarTugasContainer" class="space-y-4">
                    <!-- Tugas akan dimuat secara dinamis di sini -->
                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-slate-400">
        Dibuat oleh kelompok 6 • copyright 2026
    </footer>

    <!-- JavaScript Logika & Interaksi -->
    <script>
        // Ambil data dari LocalStorage atau buat array kosong
        let daftarTugas = JSON.parse(localStorage.getItem('daftarTugas')) || [];
        let filterAktif = 'semua'; // pilihan: 'semua', 'belum', 'selesai'

        const formTugas = document.getElementById('formTugas');
        const daftarTugasContainer = document.getElementById('daftarTugasContainer');
        const statTotal = document.getElementById('statTotal');
        const statSelesai = document.getElementById('statSelesai');

        function simpanDanRender() {
            localStorage.setItem('daftarTugas', JSON.stringify(daftarTugas));
            renderTugas();
        }

        function renderTugas() {
            daftarTugasContainer.innerHTML = '';

            // Hitung statistik
            const total = daftarTugas.length;
            const selesai = daftarTugas.filter(t => t.status === 1).length;
            statTotal.textContent = `${total} Total`;
            statSelesai.textContent = `${selesai} Selesai`;

            // Filter data sesuai tombol yang diklik
            let tugasDitampilkan = daftarTugas.filter(tugas => {
                if (filterAktif === 'belum') return tugas.status === 0;
                if (filterAktif === 'selesai') return tugas.status === 1;
                return true;
            });

            if (tugasDitampilkan.length === 0) {
                daftarTugasContainer.innerHTML = `
                    <div class="bg-white rounded-2xl border border-slate-100 p-12 text-center shadow-xl shadow-slate-100">
                        <div class="text-slate-300 mb-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
                            </svg>
                        </div>
                        <p class="text-slate-500 font-medium text-sm">Belum ada tugas dalam kategori ini.</p>
                    </div>
                `;
                return;
            }

            tugasDitampilkan.forEach((tugas) => {
                // Cari index asli di array utama (karena sudah difilter)
                const indexAsli = daftarTugas.indexOf(tugas);

                const card = document.createElement('div');
                card.className = `bg-white rounded-2xl p-5 border transition-all duration-200 shadow-xl shadow-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 ${tugas.status === 1 ? 'border-emerald-200 bg-emerald-50/20' : 'border-slate-100'}`;
                
                card.innerHTML = `
                    <div class="space-y-1.5 flex-1">
                        <div class="flex items-center gap-2">
                            <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold tracking-wide uppercase ${tugas.status === 1 ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
                                ${tugas.status === 1 ? 'Selesai' : 'Belum Selesai'}
                            </span>
                            <h3 class="font-bold text-slate-900 text-base ${tugas.status === 1 ? 'line-through text-slate-400' : ''}">${escapeHTML(tugas.mataPelajaran)}</h3>
                        </div>
                        <p class="text-sm text-slate-600 pl-0.5">${escapeHTML(tugas.deskripsi)}</p>
                        <div class="flex items-center gap-1.5 text-xs text-slate-400 pt-1">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                            <span>Deadline: ${escapeHTML(tugas.deadline)}</span>
                        </div>
                    </div>

                    <div class="flex items-center gap-2 w-full sm:w-auto justify-end border-t sm:border-t-0 pt-3 sm:pt-0 border-slate-100">
                        <button onclick="toggleStatus(${indexAsli})" 
                            class="flex-1 sm:flex-none px-4 py-2 rounded-xl text-xs font-semibold transition shadow-sm ${tugas.status === 1 ? 'bg-slate-100 hover:bg-slate-200 text-slate-600' : 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-emerald-100'}">
                            ${tugas.status === 1 ? 'Batalkan' : 'Selesai ✓'}
                        </button>
                        <button onclick="hapusTugas(${indexAsli})" 
                            class="p-2 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl transition text-xs font-medium" title="Hapus Tugas">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                    </div>
                `;
                daftarTugasContainer.appendChild(card);
            });
        }

        // Event Tambah Tugas
        formTugas.addEventListener('submit', function(e) {
            e.preventDefault();
            const mataPelajaran = document.getElementById('mataPelajaran').value;
            const deskripsi = document.getElementById('deskripsi').value;
            const deadline = document.getElementById('deadline').value;

            daftarTugas.unshift({ // Menambahkan di urutan paling atas
                mataPelajaran,
                deskripsi,
                deadline,
                status: 0
            });

            formTugas.reset();
            simpanDanRender();
        });

        // Toggle Status Selesai / Belum
        window.toggleStatus = function(index) {
            if (daftarTugas[index].status === 0) {
                daftarTugas[index].status = 1;
                // Jalankan efek Confetti (perayaan)
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            } else {
                daftarTugas[index].status = 0;
            }
            simpanDanRender();
        }

        // Hapus Tugas
        window.hapusTugas = function(index) {
            if (confirm("Apakah kamu yakin ingin menghapus tugas ini?")) {
                daftarTugas.splice(index, 1);
                simpanDanRender();
            }
        }

        // Ubah Filter Tampilan
        window.ubahFilter = function(kategori) {
            filterAktif = kategori;
            
            // Ubah gaya aktif pada tombol filter
            ['semua', 'belum', 'selesai'].forEach(kat => {
                const btn = document.getElementById(`btnFilter${kat.charAt(0).toUpperCase() + kat.slice(1)}`);
                if (kat === kategori) {
                    btn.className = "flex-1 sm:flex-none px-4 py-1.5 text-xs font-semibold rounded-lg bg-white text-indigo-600 shadow-sm transition";
                } else {
                    btn.className = "flex-1 sm:flex-none px-4 py-1.5 text-xs font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition";
                }
            });

            renderTugas();
        }

        // Fungsi aman untuk mencegah XSS sederhana
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Render pertama kali saat halaman dibuka
        renderTugas();
    </script>
</body>
</html>
